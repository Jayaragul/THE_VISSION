name: Daily edition

# The scheduled newsroom. Claude researches and writes the edition JSON; the workflow
# validates, builds and publishes it. Claude never runs git here — if the edition fails
# the gate, the job fails and yesterday's front page stays up.

on:
  schedule:
    # 06:30 UTC = 12:00 IST. GitHub queues cron jobs under load, so treat this as
    # "some time after", not "exactly at".
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD). Leave blank for today.'
        required: false
        type: string

concurrency:
  # Shared with wire.yml — both push to main.
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show what already ran
        run: node tools/edition-info.mjs ${{ inputs.date }}

      # Deterministic and free. Gives the research stage a few hundred pre-collected leads
      # so it spends model tokens on verifying and writing rather than on discovery.
      - name: Harvest candidate leads
        run: node tools/harvest.mjs ${{ inputs.date }}

      - name: Research and write the edition
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --max-turns 120
            --allowedTools WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Skill,Bash(node tools/*)
          prompt: |
            Use the news-pipeline skill to produce today's edition of THE VISSION.

            Edition date: ${{ inputs.date || '' }} (blank means today, UTC).
            Set edition.generator.trigger to "schedule".

            Start from generated/candidates/<date>.json, which the previous step just wrote.
            It holds several hundred pre-collected leads from publisher RSS feeds, so you
            should not need WebSearch for discovery — spend your budget on WebFetch,
            verifying the best candidates and finding their primary sources. Items marked
            discoveryOnly are aggregator redirects: follow them to the real publisher and
            cite that, never the aggregator.

            Work stages 1 through 4 only: research, select, write, and pass the gate at
            `node tools/validate.mjs --strict`. Then run the editorial-review skill and
            write evals/last-run.json.

            Do NOT run git. Do NOT run tools/build.mjs. This workflow does both after you
            finish, and it will refuse to publish an edition that does not pass the gate.

            If fewer stories survive verification than input/beats.json requires, write what
            you have and say so plainly in edition.summary. Never invent a source to fill a
            slot — a short edition is fine, a fabricated one ends the project.

      - name: Gate
        run: node tools/validate.mjs --strict --report evals/last-validate.json

      - name: Build the site
        run: node tools/build.mjs

      - name: Publish
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes — nothing to publish."
            exit 0
          fi
          DATE="$(node -e "console.log(require('./generated/index.json').latest)")"
          NUM="$(node -e "const m=require('./generated/index.json');console.log(m.editions[0].number)")"
          git config user.name  "the-vission-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Edition No. ${NUM} — ${DATE}" -m "Published by the scheduled pipeline."
          git push

      # Without this, a 6am failure is invisible until someone happens to look at the site.
      # One open issue at a time — re-runs comment on the existing one rather than filing a
      # new issue every morning, which is how alerting becomes noise and gets muted.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Daily edition failed"
          EXISTING="$(gh issue list --state open --label pipeline-failure --json number --jq '.[0].number' || true)"
          BODY="The scheduled edition did not publish on $(date -u '+%Y-%m-%d %H:%M UTC').

          Run: ${RUN_URL}

          The previous edition is still on the front page, and The Wire keeps updating on its
          own schedule — the site is degraded, not down. Common causes: a missing or expired
          ANTHROPIC_API_KEY, a spend cap, or an edition that failed \`validate.mjs --strict\`."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create pipeline-failure --color b60205 --description "Automated pipeline failure" 2>/dev/null || true
            gh issue create --title "$TITLE" --label pipeline-failure --body "$BODY"
          fi

      # The editorial tier failed, but the site should still get today's headlines. This is
      # the failover: no model, no key, just feeds.
      - name: Fall back to a wire-only refresh
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          node tools/harvest.mjs || true
          node tools/build.mjs
          if git diff --quiet; then
            echo "Wire produced no change."
            exit 0
          fi
          git config user.name  "the-vission-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire refresh — editorial pipeline unavailable $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
