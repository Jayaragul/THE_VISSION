name: Weekly retrospective

# The self-improvement loop, with a human gate.
#
# Once a week the model reads the last seven editions and their eval scores, finds the pattern
# that keeps costing the paper points, and proposes a fix to the RULES — a new check in the
# validator, a banned construction in editorial.md, a quota that does not match reality.
#
# It opens a pull request. It does not merge. That boundary is the whole design: an agent
# that can rewrite its own standards without review will eventually rewrite them to be
# easier to pass, and the eval scores will improve while the paper gets worse. A human
# merging a small, well-argued rule change once a week is what makes the loop safe.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The action runs `gemini --yolo`, so the approval prompt is not a control in CI. The
      # policy file is: it denies run_shell_command by default and allows only this repo own
      # tooling and read-only git, restoring the restriction the previous harness expressed as
      # --allowedTools. Installed to the home directory because that is where the CLI loads
      # policies from; it is version-controlled here so the allowlist is reviewable.
      - name: Install the shell allowlist
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gemini/policies"
          cp .gemini/policies/vission.toml "$HOME/.gemini/policies/vission.toml"
          echo "policy installed:"; cat "$HOME/.gemini/policies/vission.toml" | head -5

      - name: Propose rule changes
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          settings: |
            {
              "context": {
                "fileFiltering": { "respectGitIgnore": true }
              }
            }
          prompt: |
            Read GEMINI.md first for this repository's rules and tooling.

            Run a retrospective on THE VISSION's last seven editions.

            Read evals/rubric.md, then every evals/<date>.json for the last seven editions
            (`ls evals/*.json | sort | tail -7`, each one is bound by hash to a specific
            edition — trust the scores in it) for the score history, then the corresponding
            editions in generated/.

            Find the ONE pattern that has cost the paper the most points across those runs.
            Not a list — the single highest-leverage problem.

            Then propose a fix to the RULES, not to any individual edition:
              - a new machine check in tools/validate.mjs, if a machine can catch it
              - a banned construction in input/editorial.md and STYLE_TRAPS, if it is prose
              - a quota or lookback change in input/beats.json, if targets do not match
                what runs actually yield
              - a sharpened dimension in evals/rubric.md, if the rubric is the thing missing it

            Prefer a machine check over a written rule every time. A check cannot be
            forgotten by the next run; a paragraph in a markdown file can.

            Make the change, run `node tools/validate.mjs --strict` to confirm every existing
            edition still passes, and run `node tools/build.mjs`. If your new check fails an
            already-published edition, do NOT weaken the check and do NOT edit the archive —
            say so in the PR body and let a human decide.

            Write the branch, commit and open a pull request titled
            "Retrospective: <the one-line problem>". In the body: the evidence from the score
            history, the specific fix, and what it would have caught. Keep it short.

            Do not merge. Do not push to main.

      # The one thing this job must never be able to do is widen its own reach: touch the
      # workflow that grants it write access, or rewrite a published edition. Everything
      # else it proposes is a PR a human reads before it takes effect, which is the real
      # control — this is the floor beneath that control, not a substitute for it.
      - name: Refuse to propose changes to forbidden paths
        run: |
          set -euo pipefail
          FORBIDDEN='^(\.github/workflows/|generated/[0-9]|evals/[0-9]|LICENSE$)'
          CHANGED="$(git status --porcelain | awk '{print $2}')"
          BAD="$(echo "$CHANGED" | grep -E "$FORBIDDEN" || true)"
          if [ -n "$BAD" ]; then
            echo "::error::Retrospective proposed a change to a forbidden path — refusing to open a PR:"
            echo "$BAD"
            git checkout -- .
            exit 1
          fi

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No rule change proposed this week — that is a valid outcome."
            exit 0
          fi
          BRANCH="retrospective/$(date -u '+%Y-%m-%d')"
          # user.email is Jayaragul's own noreply address, not github-actions[bot]'s — GitHub
          # attributes contributor credit by email, so a bot-owned email here makes
          # github-actions[bot] a permanent second entry in the contributors graph no matter
          # what user.name says.
          git config user.name  "the-vission-desk[bot]"
          git config user.email "135336604+Jayaragul@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Retrospective: proposed rule change $(date -u '+%Y-%m-%d')"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Retrospective: proposed rule change $(date -u '+%Y-%m-%d')" \
            --body "Automated weekly retrospective. Review the rule change before merging — this is the human gate on the self-improvement loop." \
            --base main --head "$BRANCH"
