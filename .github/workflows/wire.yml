name: Wire

# The paper's survival tier.
#
# This workflow needs no API key, no subscription and no model. It reads public RSS feeds,
# rebuilds the site, and pushes. If the editorial pipeline stops for any reason — an expired
# key, a spend cap, a provider outage, an edition that fails the gate — this keeps running
# and the front page keeps showing what happened today.
#
# Nothing here writes prose or makes an editorial judgement. It moves verified-reachable
# headlines from publishers' own feeds onto the page, clearly labelled as unedited.

on:
  schedule:
    # Four times a day. Cheap, and GitHub Actions is free for public repositories.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  # Never race the editorial pipeline: both push to main.
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # continue-on-error: a dead feed makes harvest.mjs exit non-zero on purpose (see
      # tools/lib/feedhealth.mjs) so the failure is loud somewhere — but this tier's whole
      # reason to exist is that it keeps publishing when something else is broken, so one
      # dead feed among 30+ must not be the thing that takes it down. It has already written
      # generated/candidates/<date>.json from every feed that did answer by the time it exits;
      # only the dead-feed check runs after that. The "Report dead feed" step below still
      # surfaces it, decoupled from whether the rest of this job succeeds.
      - name: Harvest public feeds
        id: harvest
        continue-on-error: true
        run: node tools/harvest.mjs

      - name: Rebuild
        run: node tools/build.mjs

      - name: Publish
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new headlines since the last run."
            exit 0
          fi
          # user.email is Jayaragul's own noreply address, not github-actions[bot]'s — GitHub
          # attributes contributor credit by email, so a bot-owned email here makes
          # github-actions[bot] a permanent second entry in the contributors graph no matter
          # what user.name says.
          git config user.name  "the-vission-desk[bot]"
          git config user.email "135336604+Jayaragul@users.noreply.github.com"
          git add -A
          git commit -m "Wire refresh — $(date -u '+%Y-%m-%d %H:%M UTC')"
          # The editorial pipeline may have pushed while we were building.
          git pull --rebase --autostash origin main
          git push

      # Fires independently of the job's overall result — continue-on-error above means a
      # dead feed alone never fails the job, so this is the only thing that would still
      # report it.
      - name: Report dead feed
        if: steps.harvest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --state open --label wire-failure --json number --jq '.[0].number' || true)"
          BODY="Feed collection reported a failure on $(date -u '+%Y-%m-%d %H:%M UTC').

          This can mean no usable leads, a persistently failing feed, or a local processing
          error. An empty collection preserves prior candidates and their timestamp.
          Check the harvest logs and generated/feed-health.json before retrying.

          Run: ${RUN_URL}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create wire-failure --color d93f0b --description "Wire tier failure" 2>/dev/null || true
            gh issue create --title "Feed harvest degraded" --label wire-failure --body "$BODY"
          fi

      # The wire is the tier that is supposed to always work. If it stops, that is the one
      # failure nobody should ever have to discover by visiting the site.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --state open --label wire-failure --json number --jq '.[0].number' || true)"
          BODY="The wire refresh failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          Run: ${RUN_URL}

          The wire needs no API key, so this is usually either a dead feed
          (tools/harvest.mjs exits non-zero once a feed has failed 8 runs in a row — check
          generated/feed-health.json) or a build error."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create wire-failure --color d93f0b --description "Wire tier failure" 2>/dev/null || true
            gh issue create --title "Wire refresh failed" --label wire-failure --body "$BODY"
          fi
